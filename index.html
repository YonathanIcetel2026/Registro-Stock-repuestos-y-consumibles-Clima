<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Clima - DCSM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <nav class="bg-slate-900 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center text-white">
            <h1 class="text-xl font-bold">Gestión de Stock Clima - DCSM</h1>
            <span class="text-sm font-semibold text-blue-300">Supervisor: Yonathan Solorzano</span>
        </div>
    </nav>

    <div class="container mx-auto mt-6 flex flex-wrap">
        <!-- Panel Lateral -->
        <div class="w-full md:w-1/4 p-4">
            <div class="bg-white rounded-lg shadow p-4 mb-6">
                <h2 class="font-bold text-lg mb-4 text-gray-800 border-b pb-2">Navegación</h2>
                <ul class="flex flex-col space-y-2">
                    <li><button onclick="showTab('dashboard')" class="text-left w-full font-medium text-slate-700 hover:text-blue-600 hover:bg-blue-50 p-2 rounded transition">📊 Dashboard</button></li>
                    <li><button onclick="showTab('stock')" class="text-left w-full font-medium text-slate-700 hover:text-blue-600 hover:bg-blue-50 p-2 rounded transition">📦 Stock Detallado</button></li>
                    <li><button onclick="showTab('movimientos')" class="text-left w-full font-medium text-slate-700 hover:text-blue-600 hover:bg-blue-50 p-2 rounded transition">🔄 Registrar IN / OUT</button></li>
                    <li><button onclick="showTab('catalogo')" class="text-left w-full font-medium text-slate-700 hover:text-blue-600 hover:bg-blue-50 p-2 rounded transition">➕ Añadir al Catálogo</button></li>
                </ul>
            </div>
        </div>

        <!-- Contenedor Principal -->
        <div class="w-full md:w-3/4 p-4" id="main-content">
            
            <!-- Pestaña 1: Dashboard -->
            <div id="tab-dashboard" class="tab-section">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-800">Métricas por Categoría</h2>
                    <div>
                        <label class="font-bold text-sm text-gray-600 mr-2">Visualizar:</label>
                        <select id="filtroCatDashboard" class="p-2 border rounded shadow-sm bg-white font-semibold text-blue-700" onchange="renderCharts()">
                            <option value="Refrigerante">Gases Refrigerantes (Kg)</option>
                            <option value="Motores">Motores Ventiladores (Und)</option>
                            <option value="Correas">Correas (Und)</option>
                        </select>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <!-- Gráfico: Stock Actual -->
                    <div class="bg-white p-4 rounded-lg shadow border-t-4 border-blue-500">
                        <h3 class="font-bold text-gray-700 mb-2">Stock Actual</h3>
                        <canvas id="chartStock" height="200"></canvas>
                    </div>
                    
                    <!-- Gráfico: Uso por Año -->
                    <div class="bg-white p-4 rounded-lg shadow border-t-4 border-red-500">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-gray-700">Consumo Total</h3>
                            <select id="filtroAno" class="p-1 border rounded text-sm bg-gray-50" onchange="renderCharts()">
                                <option value="2024">2024</option>
                                <option value="2025">2025</option>
                                <option value="2026">2026</option>
                            </select>
                        </div>
                        <canvas id="chartUso" height="200"></canvas>
                    </div>
                </div>
            </div>

            <!-- Pestaña 2: Tabla de Stock (SEPARADA) -->
            <div id="tab-stock" class="tab-section hidden">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h2 class="text-2xl font-bold mb-4 text-gray-800 border-b pb-2">Inventario Separado por Categorías</h2>
                    <!-- Aquí se inyectarán las tablas dinámicamente -->
                    <div id="contenedor-tablas-stock"></div>
                </div>
            </div>

            <!-- Pestaña 3: Registro de Movimientos -->
            <div id="tab-movimientos" class="tab-section hidden">
                <div class="bg-white p-6 rounded-lg shadow border-t-4 border-slate-900">
                    <h2 class="text-2xl font-bold mb-6 text-gray-800">Registrar Consumo o Ingreso</h2>
                    <form id="form-movimiento" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-sm font-bold text-gray-700">Movimiento</label>
                                <select id="mov-tipo" class="mt-1 p-2 w-full border rounded shadow-sm">
                                    <option value="OUT">OUT (Consumo en Terreno)</option>
                                    <option value="IN">IN (Ingreso a Bodega)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700">Ítem</label>
                                <select id="mov-item" class="mt-1 p-2 w-full border rounded shadow-sm"></select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700">Cantidad (Unidades / Kg)</label>
                                <input type="number" step="0.1" id="mov-cantidad" class="mt-1 p-2 w-full border rounded shadow-sm" required>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700">Fecha</label>
                                <input type="date" id="mov-fecha" class="mt-1 p-2 w-full border rounded shadow-sm" required>
                            </div>
                            <div class="col-span-1 md:col-span-2 border-t pt-4 mt-2">
                                <h4 class="text-sm font-bold text-slate-500 uppercase mb-3">Detalles Técnicos</h4>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700">TAG Equipo</label>
                                <input type="text" id="mov-tag" class="mt-1 p-2 w-full border rounded shadow-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700">SALA / Ubicación</label>
                                <input type="text" id="mov-sala" class="mt-1 p-2 w-full border rounded shadow-sm">
                            </div>
                        </div>
                        <div class="mt-6">
                            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded shadow hover:bg-blue-700">Guardar Movimiento</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Pestaña 4: Nuevo Catálogo -->
            <div id="tab-catalogo" class="tab-section hidden">
                <div class="bg-white p-6 rounded-lg shadow border-t-4 border-green-600">
                    <h2 class="text-2xl font-bold mb-4 text-gray-800">Agregar Ítem al Catálogo</h2>
                    <form id="form-catalogo" class="space-y-4 max-w-lg">
                        <div>
                            <label class="block text-sm font-bold">Categoría Principal</label>
                            <select id="cat-categoria" class="mt-1 p-2 w-full border rounded">
                                <option value="Refrigerante">Gas Refrigerante</option>
                                <option value="Motores">Motores Ventiladores</option>
                                <option value="Correas">Correas</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold">Descripción Técnica</label>
                            <input type="text" id="cat-desc" class="mt-1 p-2 w-full border rounded" required>
                        </div>
                        <button type="submit" class="bg-green-600 text-white font-bold py-2 px-6 rounded hover:bg-green-700">Crear Ítem</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- 1. BASE DE DATOS INICIAL ---
        const baseExcel = [
            // REFRIGERANTES
            { id_virtual: 'ref_r410a', cat: 'Refrigerante', desc: 'R410a', stock_inicial: 70.8, uso_2024: 286.4 },
            { id_virtual: 'ref_r407c', cat: 'Refrigerante', desc: 'R407c', stock_inicial: 79.1, uso_2024: 444.3 },
            { id_virtual: 'ref_r438a', cat: 'Refrigerante', desc: 'R438A', stock_inicial: 46.2, uso_2024: 90.8 },
            { id_virtual: 'ref_r22', cat: 'Refrigerante', desc: 'R22', stock_inicial: 52.2, uso_2024: 33.2 },
            { id_virtual: 'ref_r245fa', cat: 'Refrigerante', desc: 'R245Fa', stock_inicial: 31.2, uso_2024: 38.6 },
            { id_virtual: 'ref_r32', cat: 'Refrigerante', desc: 'R32', stock_inicial: 3.0, uso_2024: 0 },
            
            // MOTORES 
            { id_virtual: 'mot_350', cat: 'Motores', desc: '220v/350mm', stock_inicial: 5, uso_2024: 2 },
            { id_virtual: 'mot_450', cat: 'Motores', desc: '220v/450mm', stock_inicial: 0, uso_2024: 2 },
            { id_virtual: 'mot_500', cat: 'Motores', desc: '220V/500mm', stock_inicial: 1, uso_2024: 5 },
            { id_virtual: 'mot_630_220', cat: 'Motores', desc: '220V/630mm', stock_inicial: 17, uso_2024: 32 },
            { id_virtual: 'mot_630_380', cat: 'Motores', desc: '380v/630mm', stock_inicial: 0, uso_2024: 6 },
            { id_virtual: 'mot_600', cat: 'Motores', desc: '220v/600mm', stock_inicial: 2, uso_2024: 10 },
            { id_virtual: 'mot_500_380', cat: 'Motores', desc: '380v/500mm', stock_inicial: 1, uso_2024: 0 },

            // CORREAS
            { id_virtual: 'cor_a46', cat: 'Correas', desc: 'A46', stock_inicial: 4, uso_2024: 0 },
            { id_virtual: 'cor_a47', cat: 'Correas', desc: 'A47', stock_inicial: 4, uso_2024: 26 },
            { id_virtual: 'cor_ap36', cat: 'Correas', desc: 'AP36', stock_inicial: 4, uso_2024: 2 },
            { id_virtual: 'cor_b138', cat: 'Correas', desc: 'B138', stock_inicial: 3, uso_2024: 3 },
            { id_virtual: 'cor_b38', cat: 'Correas', desc: 'B38', stock_inicial: 6, uso_2024: 18 },
            { id_virtual: 'cor_b39', cat: 'Correas', desc: 'B39', stock_inicial: 4, uso_2024: 6 },
            { id_virtual: 'cor_b40', cat: 'Correas', desc: 'B40', stock_inicial: 4, uso_2024: 14 },
            { id_virtual: 'cor_b47', cat: 'Correas', desc: 'B47', stock_inicial: 4, uso_2024: 0 },
            { id_virtual: 'cor_b48', cat: 'Correas', desc: 'B48', stock_inicial: 5, uso_2024: 9 }
        ];

        let inventarioFinal = [];
        let supabaseClient = null;

        // --- 2. CREDENCIALES SUPABASE ---
        const SUPABASE_URL = 'https://qedseclajeysglueveia.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_kk_uPwH9L6Xl0227Fxu8KA_Kg-jiF0v';
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 3. FUNCIONES DE INTERFAZ ---
        function showTab(tabName) {
            document.querySelectorAll('.tab-section').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');
        }

        // --- 4. MOTOR PRINCIPAL ---
        async function procesarDatos() {
            inventarioFinal = JSON.parse(JSON.stringify(baseExcel)); 
            
            if (supabaseClient) {
                const { data: dbItems } = await supabaseClient.from('inventario_items').select('*');
                if (dbItems) {
                    dbItems.forEach(dbItem => {
                        inventarioFinal.push({
                            id_virtual: 'supa_' + dbItem.id,
                            id_real: dbItem.id, 
                            cat: dbItem.categoria,
                            desc: dbItem.descripcion,
                            stock_inicial: 0,
                            uso_2024: 0, uso_2025: 0, uso_2026: 0
                        });
                    });
                }

                const { data: dbMovs } = await supabaseClient.from('inventario_movimientos').select('*');
                if (dbMovs) {
                    dbMovs.forEach(mov => {
                        let itemIndex = inventarioFinal.findIndex(i => i.id_virtual === mov.item_id || String(i.id_real) === String(mov.item_id));
                        if(itemIndex > -1) {
                            let cantidad = parseFloat(mov.cantidad);
                            let anoMov = new Date(mov.fecha).getFullYear();
                            
                            if (mov.tipo === 'IN') {
                                inventarioFinal[itemIndex].stock_inicial += cantidad;
                            } else if (mov.tipo === 'OUT') {
                                inventarioFinal[itemIndex].stock_inicial -= cantidad;
                                if(!inventarioFinal[itemIndex][`uso_${anoMov}`]) inventarioFinal[itemIndex][`uso_${anoMov}`] = 0;
                                inventarioFinal[itemIndex][`uso_${anoMov}`] += cantidad;
                            }
                        }
                    });
                }
            }

            // Llenar selector de nuevo catálogo si hay categorías nuevas
            actualizarFiltrosCategoria();

            renderSelects();
            renderTableSeparada();
            renderCharts();
        }

        function actualizarFiltrosCategoria() {
            const categoriasUnicas = [...new Set(inventarioFinal.map(item => item.cat))];
            const selectFiltro = document.getElementById('filtroCatDashboard');
            
            // Guardamos el valor seleccionado actual para no perderlo al actualizar
            const valorActual = selectFiltro.value;
            
            selectFiltro.innerHTML = categoriasUnicas.map(c => `<option value="${c}">${c}</option>`).join('');
            
            // Restaurar valor si aún existe
            if(categoriasUnicas.includes(valorActual)) {
                selectFiltro.value = valorActual;
            }
        }

        function renderSelects() {
            const select = document.getElementById('mov-item');
            // Agrupar visualmente en el selector
            let opcionesHTML = '';
            const categorias = [...new Set(inventarioFinal.map(i => i.cat))];
            categorias.forEach(cat => {
                opcionesHTML += `<optgroup label="${cat}">`;
                let itemsCat = inventarioFinal.filter(i => i.cat === cat);
                itemsCat.forEach(i => {
                    opcionesHTML += `<option value="${i.id_virtual || i.id_real}">${i.desc}</option>`;
                });
                opcionesHTML += `</optgroup>`;
            });
            select.innerHTML = opcionesHTML;
            document.getElementById('mov-fecha').valueAsDate = new Date();
        }

        // NUEVA FUNCIÓN: Tabla separada por categorías
        function renderTableSeparada() {
            const contenedor = document.getElementById('contenedor-tablas-stock');
            const categorias = [...new Set(inventarioFinal.map(i => i.cat))];
            let htmlFinal = '';

            categorias.forEach(cat => {
                let itemsCat = inventarioFinal.filter(i => i.cat === cat);
                
                // Color de encabezado por categoría para distinguirlas
                let bgHeader = 'bg-slate-800';
                if(cat === 'Refrigerante') bgHeader = 'bg-blue-800';
                if(cat === 'Motores') bgHeader = 'bg-orange-700';
                if(cat === 'Correas') bgHeader = 'bg-green-800';

                htmlFinal += `
                <div class="mb-8">
                    <h3 class="text-xl font-bold mb-3 text-gray-800 border-l-4 border-slate-500 pl-3">${cat}</h3>
                    <div class="overflow-x-auto rounded shadow">
                        <table class="min-w-full bg-white border">
                            <thead class="${bgHeader} text-white">
                                <tr>
                                    <th class="py-2 px-4 border text-left w-1/2">Descripción / Modelo</th>
                                    <th class="py-2 px-4 border text-center">Stock Actual</th>
                                    <th class="py-2 px-4 border text-center">Uso Total Acumulado</th>
                                </tr>
                            </thead>
                            <tbody class="text-gray-700">`;

                itemsCat.forEach(i => {
                    let totalUso = (i.uso_2024 || 0) + (i.uso_2025 || 0) + (i.uso_2026 || 0);
                    // Marcar en rojo si el stock es muy bajo (ajustable)
                    let limiteBajo = cat === 'Refrigerante' ? 10 : 2; 
                    let colorClass = i.stock_inicial <= limiteBajo ? 'text-red-600 font-bold bg-red-50' : 'text-center';
                    
                    htmlFinal += `
                                <tr class="border-b hover:bg-gray-50">
                                    <td class="py-2 px-4 font-semibold text-left">${i.desc}</td>
                                    <td class="py-2 px-4 ${colorClass}">${i.stock_inicial.toFixed(1)}</td>
                                    <td class="py-2 px-4 text-center">${totalUso.toFixed(1)}</td>
                                </tr>`;
                });

                htmlFinal += `
                            </tbody>
                        </table>
                    </div>
                </div>`;
            });

            contenedor.innerHTML = htmlFinal;
        }

        let chartStockInst, chartUsoInst;
        function renderCharts() {
            const ctxStock = document.getElementById('chartStock').getContext('2d');
            const ctxUso = document.getElementById('chartUso').getContext('2d');
            
            const anoFiltro = document.getElementById('filtroAno').value;
            const catFiltro = document.getElementById('filtroCatDashboard').value;

            // Filtrar inventario solo por la categoría seleccionada
            let inventarioFiltrado = inventarioFinal.filter(i => i.cat === catFiltro);

            // Gráfico de Stock
            let topStock = [...inventarioFiltrado].sort((a,b) => b.stock_inicial - a.stock_inicial);
            
            if(chartStockInst) chartStockInst.destroy();
            chartStockInst = new Chart(ctxStock, {
                type: 'bar',
                data: {
                    labels: topStock.map(i => i.desc),
                    datasets: [{
                        label: `Stock Actual (${catFiltro})`,
                        data: topStock.map(i => i.stock_inicial),
                        backgroundColor: catFiltro === 'Refrigerante' ? '#3b82f6' : (catFiltro === 'Motores' ? '#ea580c' : '#16a34a')
                    }]
                }
            });

            // Gráfico de Uso
            let topUso = [...inventarioFiltrado]
                .filter(i => (i[`uso_${anoFiltro}`] || 0) > 0)
                .sort((a,b) => b[`uso_${anoFiltro}`] - a[`uso_${anoFiltro}`]);

            if(chartUsoInst) chartUsoInst.destroy();
            chartUsoInst = new Chart(ctxUso, {
                type: 'doughnut',
                data: {
                    labels: topUso.map(i => i.desc),
                    datasets: [{
                        label: `Consumo ${anoFiltro}`,
                        data: topUso.map(i => i[`uso_${anoFiltro}`]),
                        backgroundColor: ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6', '#64748b']
                    }]
                }
            });
        }

        // --- 5. EVENTOS ---
        document.getElementById('form-movimiento').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const mov = {
                item_id: document.getElementById('mov-item').value,
                tipo: document.getElementById('mov-tipo').value,
                cantidad: parseFloat(document.getElementById('mov-cantidad').value),
                fecha: document.getElementById('mov-fecha').value,
                tag: document.getElementById('mov-tag').value,
                sala: document.getElementById('mov-sala').value
            };
            
            const { error } = await supabaseClient.from('inventario_movimientos').insert([mov]);
            if(error) alert('Error: ' + error.message);
            else {
                alert('Guardado con éxito.');
                document.getElementById('form-movimiento').reset();
                procesarDatos(); 
            }
        });

        document.getElementById('form-catalogo').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nuevoItem = {
                categoria: document.getElementById('cat-categoria').value,
                descripcion: document.getElementById('cat-desc').value
            };

            const { error } = await supabaseClient.from('inventario_items').insert([nuevoItem]);
            if(error) alert('Error: ' + error.message);
            else {
                alert('Ítem creado.');
                document.getElementById('form-catalogo').reset();
                procesarDatos();
            }
        });

        document.addEventListener('DOMContentLoaded', procesarDatos);
    </script>
</body>
</html>
